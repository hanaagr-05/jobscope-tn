services:
  mongo:
    image: mongo:7
    ports: ["27018:27017"]
    volumes: [mongo_data:/data/db]
    
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/jobscope123
    ports: ["7474:7474", "7687:7687"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]

  redis:
    image: redis:7
    ports: ["6379:6379"]


volumes:
  mongo_data:
  neo4j_data:
  es_data:
  redis:
